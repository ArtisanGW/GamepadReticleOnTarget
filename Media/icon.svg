<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Reticle On Target: a rounded nameplate with a name and a health bar, the reticle, the game's white dot,
       just below it. Palette as Alt Courier's icon: navy, teal, pastel pink and yellow, lilac. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>
  <!-- the name, with a level badge -->
  <circle cx="132" cy="116" r="12" fill="#BBA9F0"/>
  <path d="M 164 116 H 300" fill="none" stroke="#F6D98B" stroke-width="14" stroke-linecap="round"/>
  <!-- the nameplate: a pill with its health bar, mostly full -->
  <rect x="92" y="148" width="328" height="76" rx="38" fill="none" stroke="#5BE0C8" stroke-width="16"/>
  <rect x="116" y="172" width="212" height="28" rx="14" fill="#F4A7B9"/>
  <!-- a small pointer from the plate to the reticle -->
  <path d="M 236 262 L 256 282 L 276 262" fill="none" stroke="#F6D98B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the reticle: the game's white dot -->
  <circle cx="256" cy="368" r="24" fill="#FFFFFF"/>
</svg>
