<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Reticle On Target: a nameplate bar with the reticle just below it. Two colors. -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#15202E"/>
  <!-- the nameplate: an outlined bar, mostly full -->
  <rect x="96" y="104" width="320" height="64" rx="32" fill="none" stroke="#5BE0C8" stroke-width="20"/>
  <rect x="122" y="130" width="196" height="12" rx="6" fill="#5BE0C8"/>
  <!-- the reticle: a ring with four ticks and a dot -->
  <circle cx="256" cy="330" r="92" fill="none" stroke="#5BE0C8" stroke-width="22"/>
  <rect x="245" y="214" width="22" height="46" rx="11" fill="#5BE0C8"/>
  <rect x="245" y="400" width="22" height="46" rx="11" fill="#5BE0C8"/>
  <rect x="140" y="319" width="46" height="22" rx="11" fill="#5BE0C8"/>
  <rect x="326" y="319" width="46" height="22" rx="11" fill="#5BE0C8"/>
  <circle cx="256" cy="330" r="26" fill="#5BE0C8"/>
</svg>
