<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Reticle On Target: a rounded health bar, the nameplate, with the reticle, the game's white dot, just below it.
       Palette as Alt Courier's icon: navy, teal and pastel pink. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>
  <!-- the nameplate: a pill with its health bar, mostly full -->
  <rect x="92" y="167" width="328" height="76" rx="38" fill="none" stroke="#5BE0C8" stroke-width="16"/>
  <rect x="116" y="191" width="212" height="28" rx="14" fill="#F4A7B9"/>
  <!-- the reticle: the game's white dot -->
  <circle cx="256" cy="327" r="26" fill="#FFFFFF"/>
</svg>
